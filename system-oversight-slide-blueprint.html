<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Agentic System Stack</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #121212; }
  body {
    display: grid;
    place-items: center;
    font-family: Inter, "Instrument Sans", Arial, sans-serif;
  }
  .page {
    width: min(100vw, 67.5vh);
    aspect-ratio: 1080 / 1600;
    background: #ebe7de;
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
  }
  svg { display: block; width: 100%; height: 100%; background: #ebe7de; }
  .mono { font-family: "IBM Plex Mono", "JetBrains Mono", Consolas, monospace; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .ink { fill: #151923; }
  .blue { fill: #1c3d70; }
  .muted { fill: #494b48; }
  .faint { fill: #8d8c84; }
  .orange { fill: #a26223; }
  .tiny { font-size: 8.2px; letter-spacing: .72px; }
  .small { font-size: 10.5px; letter-spacing: .78px; }
  .body { font-size: 12px; }
  .body2 { font-size: 11.2px; }
  .title { font-size: 49px; font-weight: 800; letter-spacing: -.9px; }
  .box-title { font-size: 21px; font-weight: 800; letter-spacing: -.35px; }
  .layer-title { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
  .plane-title { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
  .hair { stroke: #1c3d70; stroke-width: 1.15; fill: none; vector-effect: non-scaling-stroke; }
  .hair-orange { stroke: #a26223; stroke-width: 1.15; fill: none; vector-effect: non-scaling-stroke; }
  .dash { stroke: #a99d8c; stroke-width: .95; stroke-dasharray: 4 6; fill: none; vector-effect: non-scaling-stroke; }
  .box { fill: rgba(255,255,255,.12); stroke: #1c3d70; stroke-width: 1.15; vector-effect: non-scaling-stroke; }
  .box-warm { fill: rgba(255,255,255,.10); stroke: #a26223; stroke-width: 1.15; vector-effect: non-scaling-stroke; }
  .rule { stroke: #bcb6aa; stroke-width: .85; stroke-dasharray: 4 5; vector-effect: non-scaling-stroke; }
</style>
</head>
<body>
<main class="page">
<svg viewBox="0 0 1080 1600" role="img" aria-label="The Agentic System Stack blueprint">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a99d8c"/>
    </marker>
  </defs>

  <rect width="1080" height="1600" fill="#ebe7de"/>

  <g class="hair">
    <path d="M14 14 h10 M14 14 v10 M1066 14 h-10 M1066 14 v10 M14 1586 h10 M14 1586 v-10 M1066 1586 h-10 M1066 1586 v-10"/>
  </g>

  <text x="56" y="56" class="mono tiny blue">BLU-117  -  AGENT ARCHITECTURE  -  REFERENCE MODEL</text>
  <text x="1025" y="56" text-anchor="end" class="mono tiny ink">SHT 01  -  REV C</text>
  <text x="56" y="118" class="title ink">The Agentic System Stack</text>

  <text x="56" y="178" class="mono tiny blue">WHO CONTROLS</text>
  <text x="188" y="178" class="body ink">- human involvement scales with risk</text>

  <g transform="translate(56 188)">
    <rect class="box" x="0" y="0" width="316" height="79"/>
    <text x="13" y="20" class="mono tiny blue">HUMAN JUDGES EACH CHANGE</text>
    <text x="13" y="44" class="box-title ink">HITL</text>
    <text x="13" y="61" class="body2 muted">Approval or review sits directly inside</text>
    <text x="13" y="74" class="body2 muted">the execution path.</text>

    <rect class="box" x="334" y="0" width="316" height="79"/>
    <text x="347" y="20" class="mono tiny blue">HUMAN SUPERVISES GATES</text>
    <text x="347" y="44" class="box-title ink">HOTL</text>
    <text x="347" y="61" class="body2 muted">The loop runs; exceptions, thresholds</text>
    <text x="347" y="74" class="body2 muted">and release gates escalate.</text>

    <rect class="box" x="668" y="0" width="316" height="79"/>
    <text x="681" y="20" class="mono tiny blue">HUMAN GOVERNS THE SYSTEM</text>
    <text x="681" y="44" class="box-title ink">SYSTEM OVERSIGHT</text>
    <text x="681" y="61" class="body2 muted">Policy, evals, rollback and telemetry</text>
    <text x="681" y="74" class="body2 muted">carry the burden.</text>
  </g>

  <text x="56" y="311" class="mono tiny blue">HOW AGENTS COMPOSE</text>

  <g transform="translate(56 320)">
    <rect class="box" x="0" y="0" width="477" height="68"/>
    <text x="13" y="18" class="mono tiny blue">T1  -  SEQUENTIAL  -  canHandoffTo</text>
    <text x="13" y="41" class="box-title ink">SEQUENTIAL HANDOFF</text>
    <text x="13" y="58" class="body2 muted">Current task ownership transfers; one agent is active at a time.</text>

    <rect class="box" x="507" y="0" width="477" height="68"/>
    <text x="520" y="18" class="mono tiny blue">T2  -  DELEGATIVE  -  Delegation</text>
    <text x="520" y="41" class="box-title ink">DELEGATIVE WORKERS</text>
    <text x="520" y="58" class="body2 muted">Coordinator creates subtasks; isolated workers return typed results.</text>

    <rect class="box" x="0" y="82" width="477" height="68"/>
    <text x="13" y="100" class="mono tiny blue">T3  -  COLLABORATIVE / EMERGENT  -  TeamLeadership</text>
    <text x="13" y="123" class="box-title ink">TEAM LEADERSHIP</text>
    <text x="13" y="140" class="body2 muted">Lead creates a team; members claim tasks and message peers.</text>

    <rect class="box" x="507" y="82" width="477" height="68"/>
    <text x="520" y="100" class="mono tiny blue">T4  -  STRUCTURED TURN-TAKING  -  Moderation</text>
    <text x="520" y="123" class="box-title ink">MODERATION</text>
    <text x="520" y="140" class="body2 muted">Moderator controls turns, transcript scope and completion.</text>
  </g>

  <g class="mono tiny blue" transform="translate(0 -16)">
    <text x="76" y="576" transform="rotate(-90 76 576)">ORCHESTRATION</text>
    <path class="hair" d="M86 528 v107 m0 -107 h8 m-8 107 h8"/>

    <text x="78" y="874" transform="rotate(-90 78 874)">CONTEXT ENGINEERING</text>
    <path class="hair" d="M86 762 v338 m0 -338 h8 m-8 338 h8"/>

    <text x="78" y="1214" transform="rotate(-90 78 1214)">TOOL ENG.</text>
    <path class="hair" d="M86 1116 v114 m0 -114 h8 m-8 114 h8"/>

    <text x="128" y="820" transform="rotate(-90 128 820)">LOOP ENG.</text>
    <path class="hair" d="M134 645 v220 m0 -220 h8 m-8 220 h8"/>

    <text x="128" y="968" transform="rotate(-90 128 968)">PROMPT ENG.</text>
    <path class="hair" d="M134 876 v120 m0 -120 h8 m-8 120 h8"/>

    <text x="128" y="1126" transform="rotate(-90 128 1126)">KNOWLEDGE ENG.</text>
    <path class="hair" d="M134 1008 v218 m0 -218 h8 m-8 218 h8"/>

    <text x="174" y="966" transform="rotate(-90 174 966)">RAG  -  READ PATH</text>
    <path class="dash" d="M185 646 v675" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(196 500)">
    <rect class="box" x="0" y="0" width="528" height="111"/>
    <text x="18" y="32" class="mono small blue">L08</text>
    <text x="73" y="38" class="layer-title ink">WORKFLOW &amp; ORCHESTRATION</text>
    <text x="458" y="32" class="mono tiny faint">THE SYSTEM</text>
    <text x="73" y="72" class="body muted">canHandoffTo, Delegation, TeamLeadership, Moderation</text>
    <text x="73" y="92" class="body muted">queues, schedules, events, handoffs</text>

    <rect class="box" x="0" y="120" width="528" height="111"/>
    <text x="18" y="152" class="mono small blue">L07</text>
    <text x="73" y="158" class="layer-title ink">HARNESS &amp; LOOP RUNTIME</text>
    <text x="420" y="152" class="mono tiny faint">NERVOUS SYSTEM</text>
    <text x="73" y="192" class="body muted">Plan -> act -> observe -> evaluate -> next state</text>
    <text x="73" y="212" class="body muted">continue - retry - replan - escalate - stop - roll back</text>

    <rect class="box" x="0" y="240" width="528" height="111"/>
    <text x="18" y="272" class="mono small blue">L06</text>
    <text x="73" y="278" class="layer-title ink">RUNTIME CONTEXT ASSEMBLY</text>
    <text x="422" y="272" class="mono tiny faint">THE WORKBENCH</text>
    <text x="73" y="312" class="body muted">Per-step selection: instructions, state, retrieved evidence</text>
    <text x="73" y="332" class="body muted">memories, tool results, summaries</text>

    <rect class="box" x="0" y="360" width="528" height="111"/>
    <text x="18" y="392" class="mono small blue">L05</text>
    <text x="73" y="398" class="layer-title ink">INSTRUCTIONS &amp; CONTRACTS</text>
    <text x="414" y="392" class="mono tiny faint">THE CONSTITUTION</text>
    <text x="73" y="432" class="body muted">Identity, goals, constraints, few-shot examples</text>
    <text x="73" y="452" class="body muted">tool guidance, structured output contracts</text>

    <rect class="box" x="0" y="480" width="528" height="111"/>
    <text x="18" y="512" class="mono small blue">L04</text>
    <text x="73" y="518" class="layer-title ink">KNOWLEDGE, MEMORY &amp; STATE</text>
    <text x="450" y="512" class="mono tiny faint">THE LIBRARY</text>
    <text x="73" y="552" class="body muted">RAG corpora, semantic &amp; episodic memory, provenance</text>
    <text x="73" y="572" class="body muted">procedural knowledge, persistent state</text>

    <rect class="box" x="0" y="600" width="528" height="111"/>
    <text x="18" y="632" class="mono small blue">L03</text>
    <text x="73" y="638" class="layer-title ink">TOOLS, APIs &amp; SKILLS</text>
    <text x="470" y="632" class="mono tiny faint">THE HANDS</text>
    <text x="73" y="672" class="body muted">Tool schemas, MCP servers, integrations, code execution</text>
    <text x="73" y="692" class="body muted">permissions, validation, idempotency</text>

    <rect class="box" x="0" y="720" width="528" height="111"/>
    <text x="18" y="752" class="mono small blue">L02</text>
    <text x="73" y="758" class="layer-title ink">MODELS &amp; INFERENCE</text>
    <text x="470" y="752" class="mono tiny faint">THE BRAIN</text>
    <text x="73" y="792" class="body muted">Reasoning, efficient, multimodal, embedding, guard models</text>
    <text x="73" y="812" class="body muted">routing, caching, fallback</text>

    <rect class="box" x="0" y="840" width="528" height="111"/>
    <text x="18" y="872" class="mono small blue">L01</text>
    <text x="73" y="878" class="layer-title ink">RUNTIME &amp; ENVIRONMENT</text>
    <text x="462" y="872" class="mono tiny faint">BODY &amp; LEGS</text>
    <text x="73" y="912" class="body muted">Compute, containers, sandboxes, filesystem, network</text>
    <text x="73" y="932" class="body muted">secrets, databases, external systems</text>

    <path class="dash" d="M8 116 h512"/>
    <path class="dash" d="M8 476 h512"/>
    <path class="dash" d="M8 836 h512"/>
  </g>

  <text x="760" y="510" class="mono tiny blue">THE HORIZONTAL PLANES</text>

  <g transform="translate(760 528)">
    <rect class="box" x="0" y="0" width="290" height="290"/>
    <text x="16" y="32" class="mono small blue">PA</text>
    <text x="16" y="74" class="plane-title ink">GOVERNANCE, POLICY</text>
    <text x="16" y="96" class="plane-title ink">&amp; HUMAN CONTROL</text>
    <text x="16" y="132" class="body2 muted">- Risk &amp; blast-radius classification</text>
    <text x="16" y="160" class="body2 muted">- Deterministic guardrails outside</text>
    <text x="26" y="177" class="body2 muted">model reasoning</text>
    <text x="16" y="205" class="body2 muted">- HITL, HOTL, System Oversight</text>
    <text x="26" y="222" class="body2 muted">authority placement</text>
    <text x="16" y="250" class="body2 muted">- Budgets, approvals, release &amp;</text>
    <text x="26" y="267" class="body2 muted">rollback policy</text>

    <rect class="box" x="0" y="322" width="290" height="290"/>
    <text x="16" y="354" class="mono small blue">PB</text>
    <text x="16" y="396" class="plane-title ink">IDENTITY, SECURITY</text>
    <text x="16" y="418" class="plane-title ink">&amp; TRUST</text>
    <text x="16" y="454" class="body2 muted">- Agent &amp; user identity; least privilege</text>
    <text x="16" y="482" class="body2 muted">- Delegated authority, secrets,</text>
    <text x="26" y="499" class="body2 muted">data boundaries</text>
    <text x="16" y="527" class="body2 muted">- Prompt-injection defense &amp;</text>
    <text x="26" y="544" class="body2 muted">tool sandboxing</text>
    <text x="16" y="572" class="body2 muted">- Auditable actions across</text>
    <text x="26" y="589" class="body2 muted">every handoff</text>

    <rect class="box" x="0" y="644" width="290" height="290"/>
    <text x="16" y="676" class="mono small blue">PC</text>
    <text x="16" y="718" class="plane-title ink">OBSERVABILITY, EVALS</text>
    <text x="16" y="740" class="plane-title ink">&amp; ECONOMICS</text>
    <text x="16" y="776" class="body2 muted">- Traces, state transitions,</text>
    <text x="26" y="793" class="body2 muted">tool-call evidence</text>
    <text x="16" y="821" class="body2 muted">- Golden scenarios, LLM-as-judge,</text>
    <text x="26" y="838" class="body2 muted">deterministic checks</text>
    <text x="16" y="866" class="body2 muted">- Drift, regression &amp; reliability</text>
    <text x="26" y="883" class="body2 muted">attribution</text>
    <text x="16" y="911" class="body2 muted">- Cost, latency &amp; resource telemetry</text>
  </g>

  <path class="hair" d="M729 609 h13 l18 32"/>
  <path class="hair" d="M729 976 h31"/>
  <path class="hair" d="M729 1290 h13 l18 -32"/>

  <line x1="56" y1="1465" x2="1024" y2="1465" class="rule"/>
  <text x="816" y="1539" class="ink" opacity=".035" style="font-size:132px;font-weight:900;letter-spacing:-6px;">117</text>
  <text x="56" y="1492" class="orange" style="font-size:17px;font-weight:800;">///</text>
  <text x="88" y="1491" class="mono tiny blue">BLUEPRINT</text>
  <text x="178" y="1491" class="body ink"><tspan font-weight="700">Layers compose upward</tspan> and must hold even when the model reasons badly.</text>
  <text x="56" y="1513" class="mono tiny blue">LOOP VS ORCH</text>
  <text x="178" y="1513" class="body muted">Loop engineering controls one execution cycle; orchestration composes loops, agents and workflows.</text>
  <text x="56" y="1535" class="mono tiny blue">LEARNING LOOP</text>
  <text x="178" y="1535" class="body muted">Traces and evaluations feed improvements back into prompts, knowledge, context policies, skills, tools and orchestration.</text>
  <text x="56" y="1557" class="mono tiny blue">SRC</text>
  <text x="88" y="1557" class="mono tiny ink">Akka AutonomousAgent docs - Anthropic engineering - Google agents guide</text>
  <text x="806" y="1557" class="mono tiny ink">DRAWN - TYLER JEWELL</text>
  <text x="1024" y="1557" text-anchor="end" class="mono tiny ink">ADAPTED - AKKA</text>
</svg>
</main>
</body>
</html>
